<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mikey Dorje &mdash; Links</title>
  <meta name="description" content="Links to Mikey Dorje music, live techno jams, and releases on Bandcamp, YouTube, and Spotify.">
  <meta property="og:title" content="Mikey Dorje &mdash; Links">
  <meta property="og:description" content="Links to Mikey Dorje music, live techno jams, and releases on Bandcamp, YouTube, and Spotify.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mikeydorje.com/links/">
  <meta name="theme-color" content="#050508">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 36px 20px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #050508;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.5;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      width: min(440px, 100%);
      text-align: center;
    }

    .title {
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
      margin-bottom: 26px;
    }

    .cta-group {
      display: grid;
      gap: 12px;
    }

    .cta {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.92);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.4px;
      font-weight: 500;
      font-family: inherit;
      line-height: 1.35;
      text-align: center;
      transition: all 0.22s ease;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .cta:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.45);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .cta:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.05);
    }

    .cta svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .cta.youtube svg {
      color: #ff0000;
    }

    .cta.bandcamp svg {
      color: #1da0c3;
    }

    .cta.spotify svg {
      color: #1ed760;
    }

    .cta:hover svg {
      filter: brightness(1.2);
    }

    .copyright {
      margin-top: 36px;
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
    }

    /*
      NOTE: Bandcamp code giveaway system is archived in bandcamp-code-feature.backup.html
      for easy future re-enablement.
    */
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="title">Mikey Dorje</h1>

    <div class="cta-group">
      <!-- 1. Live Techno Jam on YouTube -->
      <a class="cta youtube" href="https://www.youtube.com/watch?v=vp9oG1oMUEQ" target="_blank" rel="noopener noreferrer" aria-label="Live Techno Jam with M_MCHN on YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>Live Techno Jam with M_MCHN</span>
      </a>

      <!-- 2. Bandcamp EP -->
      <a class="cta bandcamp" href="https://mikeydorje.bandcamp.com" target="_blank" rel="noopener noreferrer" aria-label="New EP Spark out now only on Bandcamp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 6h11L11.2 18H.2L6.5 6Z"/></svg>
        <span>New EP Spark out now only on Bandcamp</span>
      </a>

      <!-- 3. Spotify Link -->
      <a class="cta spotify" href="https://open.spotify.com/artist/2i0W2ULTtPnarfN4Xtk2R9" target="_blank" rel="noopener noreferrer" aria-label="Listen to more of Mikey Dorje on Spotify">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.32a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.16a.75.75 0 1 1-.33-1.46c4.57-1.04 8.5-.59 11.66 1.34.36.22.47.69.25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.99-8.16-2.56-11.98-1.4a.94.94 0 1 1-.55-1.79c4.37-1.33 9.8-.69 13.51 1.59.44.27.58.85.31 1.29zm.13-3.4C15.27 8.45 8.84 8.22 5.21 9.32a1.13 1.13 0 1 1-.66-2.16c4.17-1.27 11.27-1.02 15.7 1.61a1.13 1.13 0 0 1-1.15 1.94z"/></svg>
        <span>More on Spotify</span>
      </a>
    </div>

    <footer class="copyright">&copy; <span id="year">2026</span> Mikey Dorje</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
