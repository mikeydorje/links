<!--
  BANDCAMP CODE GIVEAWAY SYSTEM (BACKUP / ARCHIVE)
  Preserved from Mikey Dorje links page for future reuse.
  Contains complete HTML, CSS, and JS required to claim and display Bandcamp yum codes.
-->

<!-- CSS SNIPPETS -->
<style>
  .count {
    margin: -5px 0 4px;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    min-height: 1.4em;
  }

  .count strong {
    color: rgba(125, 255, 220, 0.95);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-right: 2px;
  }

  .code-panel {
    margin-top: 16px;
    padding: 16px;
    border: 1px solid rgba(125, 255, 220, 0.35);
    border-radius: 14px;
    background: rgba(125, 255, 220, 0.06);
    text-align: center;
    display: none;
  }
  .code-panel.visible { display: block; }
  .code-panel .label {
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 10px;
  }
  .code-box {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px;
    border: 1px dashed rgba(125, 255, 220, 0.5);
    border-radius: 10px;
    background: rgba(0,0,0,0.35);
    color: rgba(125, 255, 220, 0.95);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 18px;
    letter-spacing: 2px;
    font-weight: 600;
    cursor: pointer;
    user-select: all;
    transition: all 0.2s;
  }
  .code-box:hover {
    border-color: rgba(125, 255, 220, 0.9);
    background: rgba(0,0,0,0.5);
  }
  .code-box.copied {
    color: rgba(255,255,255,0.95);
    border-style: solid;
    border-color: rgba(125, 255, 220, 0.9);
  }
  .code-box .copy-hint {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    font-weight: 500;
  }
  .code-actions {
    margin-top: 14px;
    display: grid;
    gap: 6px;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
  }
  .code-actions a {
    color: rgba(255,255,255,0.75);
    text-decoration: underline;
    text-decoration-color: rgba(255,255,255,0.25);
    text-underline-offset: 3px;
    transition: color 0.2s, text-decoration-color 0.2s;
  }
  .code-actions a:hover {
    color: #ffffff;
    text-decoration-color: rgba(125, 255, 220, 0.7);
  }
  .code-actions .auto {
    color: rgba(125, 255, 220, 0.85);
    text-decoration-color: rgba(125, 255, 220, 0.4);
  }
  .code-actions .auto:hover {
    color: rgba(125, 255, 220, 1);
    text-decoration-color: rgba(125, 255, 220, 0.9);
  }
</style>

<!-- HTML MARKUP -->
<button type="button" class="cta" id="download-cta" aria-label="Get a free Bandcamp download code">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 6h11L11.2 18H.2L6.5 6Z"/></svg>
  <span id="download-label">Free Download Code</span>
</button>
<p class="count" id="count" aria-live="polite"></p>

<div class="code-panel" id="code-panel" aria-live="polite">
  <div class="label">Your code</div>
  <div class="code-box" id="code-box" role="button" tabindex="0" title="Click to copy">
    <span id="code-text"></span>
    <span class="copy-hint" id="copy-hint">Copy</span>
  </div>
  <div class="code-actions">
    <div>Redeem at <a id="manual-link" href="https://mikeydorje.bandcamp.com/yum" target="_blank" rel="noopener noreferrer">mikeydorje.bandcamp.com/yum</a></div>
    <div><a id="auto-link" class="auto" href="#" target="_blank" rel="noopener noreferrer">or click here to apply automatically &rarr;</a></div>
  </div>
</div>

<!-- JAVASCRIPT LOGIC -->
<script>
  const countEl = document.getElementById('count');
  const ctaGroup = document.getElementById('cta-group');
  const cta = document.getElementById('download-cta');
  const label = document.getElementById('download-label');
  const panel = document.getElementById('code-panel');
  const codeBox = document.getElementById('code-box');
  const codeText = document.getElementById('code-text');
  const copyHint = document.getElementById('copy-hint');
  const manualLink = document.getElementById('manual-link');
  const autoLink = document.getElementById('auto-link');

  let claiming = false;

  async function loadCount() {
    try {
      const res = await fetch('/spark-download/status', { cache: 'no-store' });
      if (!res.ok) throw new Error('status ' + res.status);
      const data = await res.json();
      const n = Number(data.available) || 0;
      if (n === 0) {
        countEl.textContent = 'No codes available right now';
        cta.setAttribute('aria-disabled', 'true');
        cta.disabled = true;
        label.textContent = 'Sold out for now';
      } else {
        countEl.innerHTML = '<strong>' + n + '</strong> code' + (n === 1 ? '' : 's') + ' available';
      }
    } catch (e) {
      countEl.textContent = '';
    }
  }

  async function copyCode(code) {
    try {
      await navigator.clipboard.writeText(code);
      codeBox.classList.add('copied');
      copyHint.textContent = 'Copied!';
      setTimeout(() => {
        codeBox.classList.remove('copied');
        copyHint.textContent = 'Copy';
      }, 1800);
    } catch (e) {
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(codeText);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  async function claim() {
    if (claiming || cta.disabled) return;
    claiming = true;
    const prevLabel = label.textContent;
    label.textContent = 'Getting code...';
    cta.setAttribute('aria-disabled', 'true');
    try {
      const res = await fetch('/spark-download/claim', { method: 'POST', cache: 'no-store' });
      const data = await res.json();
      if (!data.available || !data.code) {
        countEl.textContent = 'No codes available right now';
        label.textContent = 'Sold out for now';
        cta.disabled = true;
        return;
      }
      showCode(data.code, data.redeem_url, data.manual_url);
      try {
        localStorage.setItem('spark_code', JSON.stringify({
          code: data.code,
          redeem_url: data.redeem_url,
          manual_url: data.manual_url,
          at: Date.now(),
        }));
      } catch (_) {}
      copyCode(data.code);
      loadCount();
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) {
      label.textContent = prevLabel;
      cta.removeAttribute('aria-disabled');
      alert('Could not get a code. Please try again.');
    } finally {
      claiming = false;
    }
  }

  function showCode(code, redeemUrl, manualUrl) {
    codeText.textContent = code;
    manualLink.href = manualUrl || 'https://mikeydorje.bandcamp.com/yum';
    autoLink.href = redeemUrl || ('https://bandcamp.com/yum?code=' + encodeURIComponent(code));
    panel.classList.add('visible');
    ctaGroup.style.display = 'none';
  }

  function restoreSavedCode() {
    try {
      const raw = localStorage.getItem('spark_code');
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (!saved || !saved.code) return;
      showCode(saved.code, saved.redeem_url, saved.manual_url);
    } catch (_) {}
  }

  if (cta) cta.addEventListener('click', claim);
  if (codeBox) {
    codeBox.addEventListener('click', () => copyCode(codeText.textContent));
    codeBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyCode(codeText.textContent); }
    });
  }

  restoreSavedCode();
  loadCount();
</script>
